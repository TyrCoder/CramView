<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cramview</title>
  <meta name="description" content="Make reviewers, quizzes, timed exams and flashcards. Works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <!-- iPhone / iPad (Safari "Add to Home Screen") -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cramview">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">📚</div>
      <p>Loading Cramview…</p>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">Cramview needs JavaScript turned on.</p>
  </noscript>
</body>
</html>
